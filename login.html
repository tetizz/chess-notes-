<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FaithChess — Log In</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=astra-20260904-final">
</head>
<body>

<header></header>

<main>
  <div class="auth-wrap">
    <form class="auth-box" id="loginForm">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Log in to your FaithChess account</p>
      <div class="auth-field">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="auth-field">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <div id="authError" class="auth-error hidden" role="alert"></div>
      <button class="auth-btn" id="loginBtn" type="submit">Log in</button>
      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </form>
  </div>
</main>

<script src="nav.js?v=astra-20260904-final"></script>
<script src="settings.js?v=astra-20260904-final"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyAUdXVlmN9xhhIzubK0MTtGO3hA9JkHClA",
    authDomain: "faithchess.firebaseapp.com",
    databaseURL: "https://faithchess-default-rtdb.firebaseio.com",
    projectId: "faithchess",
    storageBucket: "faithchess.firebasestorage.app",
    messagingSenderId: "132292001988",
    appId: "1:132292001988:web:3c9b7227f1b09766b48991"
  });

  const auth = getAuth(app);

  document.getElementById("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    const email = document.getElementById("emailInput").value.trim();
    const password = document.getElementById("passwordInput").value;
    const errEl = document.getElementById("authError");
    const submitBtn = document.getElementById("loginBtn");
    errEl.classList.add("hidden");
    try {
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in…";
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "index.html";
    } catch (err) {
      errEl.textContent = friendlyError(err.code);
      errEl.classList.remove("hidden");
      submitBtn.disabled = false;
      submitBtn.textContent = "Log in";
    }
  });

  function friendlyError(code) {
    if (code === "auth/user-not-found") return "No account with that email.";
    if (code === "auth/wrong-password") return "Incorrect password.";
    if (code === "auth/invalid-credential") return "Email or password is incorrect.";
    if (code === "auth/invalid-email") return "Invalid email address.";
    if (code === "auth/too-many-requests") return "Too many attempts. Try again later.";
    if (code === "auth/network-request-failed") return "Could not reach the account service. Check your connection.";
    return "Something went wrong. Please try again.";
  }
</script>

</body>
</html>
